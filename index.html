<HTML>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Not Coffee</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

<script src="https://auth.magic.link/sdk"></script>

<style>
body {
  background-color: #E58EA1;
  color: #4F3711;
  font-family: "Gill Sans", sans-serif;
  background-image: url('notcoffeebackgroundimage.png');
  background-size: 500px;
}

h1 { text-align:center; font-size:80px; font-weight:bold; }

#logo {
  height:160px;
  width:410px;
  display:block;
  margin: 10px auto;
}

/* GRID */
.wrapper {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}

/* CARD BOXES */
.container, .container2 {
  height: 200px;
  width: 200px;
  background: #fff;
  border-radius: 8px;
  position: relative;
  overflow: hidden; /* IMPORTANT */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 10px;
}

/* ⭐ FIX: images inside grid */
.container img,
.container2 img {
  width: 100%;
  height: 120px;
  object-fit: cover; /* keeps cropping neat */
  border-radius: 6px;
}

/* CHECKBOX LABEL */
.container label,
.container2 label {
  font-size: 14px;
  text-align: center;
}

/* Instagram button */
#instagramButtonText {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 1000;
  background: linear-gradient(45deg, #c47aff, #ff7eb9, #ffcc7f);
  color: white;
  border: none;
  border-radius: 30px;
  padding: 0.75rem 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: bold;
}

/* INPUT BOX */
#customerInput {
  position: relative;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 2rem;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

#specAddr, #postCode {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
}

#autoLoc, #submitBtn {
  width: 48%;
  margin-top: 10px;
  background: #26a69a;
  color: white;
  border-radius: 10px;
}

/* RESULTS IMAGE FIX */
.collection-item.avatar img.circle {
  width: 50px !important;
  height: 50px !important;
  object-fit: cover;
}

#optionsHeader {
  display:none;
  text-align:center;
  margin-top: 30px;
}

#options {
  display:none;
}

#optionResults {
  margin: 20px;
}
</style>
</head>

<body>

<img id="logo" src="notcoffeelogo.png" />

<button id="instagramButtonText"
onclick="window.open('https://www.instagram.com/notcoffeeplz/', '_blank')">
@notcoffeeplz
</button>

<ul class="wrapper">

  <li class="container">
    <label><input id="matcha" type="checkbox" class="filled-in"><span>Matcha Latte</span></label>
    <img src="matcha.jpg">
  </li>

  <li class="container">
    <label><input id="chai" type="checkbox" class="filled-in" checked><span>Chai</span></label>
    <img src="masalachai.jpg">
  </li>

  <li class="container">
    <label><input id="turmeric latte" type="checkbox" class="filled-in"><span>Golden Mylk</span></label>
    <img src="goldenmylk.jpeg">
  </li>

  <li class="container2">
    <label><input id="hot chocolate" type="checkbox" class="filled-in"><span>Hot Chocolate</span></label>
    <img src="hotchoc1.jpeg">
  </li>

  <li class="container2">
    <label><input id="bubble tea" type="checkbox" class="filled-in"><span>Bubble Tea</span></label>
    <img src="bubbletea.png">
  </li>

  <li class="container2">
    <label><input id="smoothies" type="checkbox" class="filled-in"><span>Smoothies</span></label>
    <img src="smoothies1.jpeg">
  </li>

</ul>

<div id="customerInput">

  <label>Where?</label>

  <input id="specAddr" placeholder="Address" type="text"/>
  <input id="postCode" placeholder="Postcode" type="text"/>

  <button id="autoLoc" onclick="autoLoc()">AutoLocate</button>
  <button id="submitBtn" onclick="submit()">Submit</button>

</div>

<h2 id="optionsHeader">Options:</h2>
<div id="options">
  <ul id="optionResults" class="collection"></ul>
</div>

<script>
// (unchanged JS — no need to modify for image fix)

function submit() {
  $("#optionResults").empty();

  let locVar =
    (document.getElementById('specAddr').value || "") +
    " " +
    (document.getElementById('postCode').value || "");

  let boxes = $(":checkbox:checked");

  let customerBevs = [];
  for (let i = 0; i < boxes.length; i++) {
    customerBevs.push(boxes[i].id);
  }

  if (customerBevs.length === 0) return;

  customerBevs.forEach(currBev => {

    let url =
      "https://cryptollama.app/my-apis&type=1" +
      "&term=" + encodeURIComponent(currBev) +
      "&location=" + encodeURIComponent(locVar);

    $.getJSON(url, function(result) {
      if (result.status == 200 && result.success) {

        $("#optionsHeader").show();
        $("#options").show();

        let item = result.info[0];

        $("#optionResults").append(
          "<li class='collection-item avatar'>" +
          "<a href='" + item.url + "'>" +
          "<img src='" + item.image_url + "' class='circle'>" +
          "<span class='title'>" + item.name + "</span><br>" +
          item.location.address1 + " " + item.location.zip_code +
          "<br>" + item.location.city +
          "</a></li>"
        );
      }
    });

  });
}

function autoLoc() {
  if (!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(function(position) {
    autoLocSubmit(position.coords.longitude, position.coords.latitude);
  });
}

function autoLocSubmit(long, lat) {

  $("#optionResults").empty();

  let boxes = $(":checkbox:checked");
  let customerBevs = [];

  boxes.each(function() {
    customerBevs.push(this.id);
  });

  customerBevs.forEach(currBev => {

    $.getJSON(
      "https://cryptollama.app/my-apis&type=2" +
      "&term=" + currBev +
      "&longitude=" + long.toFixed(2) +
      "&latitude=" + lat.toFixed(2),

      function(result) {
        if (result.status == 200 && result.success) {

          $("#optionsHeader").show();
          $("#options").show();

          let item = result.info[0];

          $("#optionResults").append(
            "<li class='collection-item avatar'>" +
            "<a href='" + item.url + "'>" +
            "<img src='" + item.image_url + "' class='circle'>" +
            "<span class='title'>" + item.name + "</span><br>" +
            item.location.address1 +
            "</a></li>"
          );
        }
      }
    );

  });
}
</script>

</body>
</HTML>
